project:
  type: website
  output-dir: docs
  pre-render:
    - powershell -ExecutionPolicy Bypass -File scripts/sync-notebooks.ps1
  render:
    - index.qmd
    - numerica.qmd
    - combinatoria.qmd
    - reporte_tecnico.qmd
    - notebooks/**/*.ipynb
    - presentacion/**/*.ipynb

website:
  title: "Trabajo Carlos"
  navbar:
    left:
      - href: index.qmd
        text: Inicioo
      - href: numerica.qmd
        text: Numerica
      - href: combinatoria.qmd
        text: Combinatoria
      - href: reporte_tecnico.qmd
        text: Reporte Tecnico
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - numerica.qmd
      - combinatoria.qmd
      - reporte_tecnico.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-summary: "Ver codigo"

execute:
  enabled: false